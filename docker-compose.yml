version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: contextforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-codeforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - contextforge-network

  redis:
    image: redis:7-alpine
    container_name: contextforge-redis
    ports:
      - "6379:6379"
    networks:
      - contextforge-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: contextforge-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - contextforge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextforge-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - contextforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contextforge-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - contextforge-network

  nginx:
    image: nginx:alpine
    container_name: contextforge-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - contextforge-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  contextforge-network:
    driver: bridge
